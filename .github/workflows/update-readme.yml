name: Update README Stats & Index

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: update-readme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run README Update Script
        run: |
          python scripts/update_readme.py --write

      - name: Commit and Push Changes
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "docs: update problem count and index in README [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes in README.md"
          fi

      - name: Check README in Pull Requests
        if: github.event_name == 'pull_request'
        run: |
          python scripts/update_readme.py --check
